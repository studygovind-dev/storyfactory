# Manual test of the YouTube upload. The video is uploaded as PRIVATE (nothing becomes public).
# Check it in YouTube Studio -> Content, then delete it.
name: Test YouTube
on: workflow_dispatch
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      POST_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests
          mkdir -p output/test
          ffmpeg -v error -f lavfi -i testsrc2=s=1080x1920:r=24 -f lavfi -i sine=f=300 -t 10 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart output/test/final.mp4
          echo '{"yt_title":"Upload test (private)","description":"test","hashtags":["#test"]}' > output/test/ep.json
          python pipeline/post_youtube.py output/test/final.mp4 output/test/ep.json
