# Daily Story Factory: 3 short videos a day (story 9:00, joke 13:00, story 17:00 India time).
#
# GitHub starts scheduled runs late (sometimes hours) or skips them, so there
# are several runs a day. Each run makes whatever part is due and not sent yet
# (pipeline/daily.py), waits until its send time, then sends it. Runs that
# find nothing to do finish in about a minute.
name: Daily story

on:
  schedule:
    - cron: "37 1 * * *"   # 07:07 IST  video 1 (sent at 9:00)
    - cron: "17 3 * * *"   # 08:47 IST  backup
    - cron: "37 5 * * *"   # 11:07 IST  video 2 (sent at 13:00)
    - cron: "17 7 * * *"   # 12:47 IST  backup
    - cron: "37 9 * * *"   # 15:07 IST  video 3 (sent at 17:00)
    - cron: "17 11 * * *"  # 16:47 IST  backup
    - cron: "37 13 * * *"  # 19:07 IST  last catch-up for anything missed
  workflow_dispatch:
    inputs:
      part:
        description: "Make and send this part right now (1, 2 or 3). Empty = whatever is due."
        default: ""

permissions:
  contents: write   # saves the story and "sent" markers back to the repo

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Kolkata
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}      # Cloudflare Workers AI pictures (free allowance)
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}          # Facebook + Instagram auto-posting
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}   # temporary public link for Instagram reels
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}        # licensed backup voice (Azure Speech)
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}          # YouTube Shorts auto-upload
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      VOICE_FEMALE: ${{ secrets.VOICE_FEMALE }}
      VOICE_MALE: ${{ secrets.VOICE_MALE }}
      VOICE_CHILD: ${{ secrets.VOICE_CHILD }}
      VOICE_NARRATOR_MALE: ${{ secrets.VOICE_NARRATOR_MALE }}
      KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
      KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
      # Budget mode: set the repo variable KLING_CLIPS_PER_PART to 1 (about Rs 3,300/month). 0 = free.
      KLING_CLIPS_PER_PART: ${{ vars.KLING_CLIPS_PER_PART || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest code and "sent" markers, even for runs that waited in the queue

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          pip install -q requests edge-tts gtts pillow transformers
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu   # free 3D depth model
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"

      - name: Make and send what is due
        run: |
          if [ -n "${{ github.event.inputs.part }}" ]; then
            python pipeline/daily.py --part "${{ github.event.inputs.part }}"
          else
            python pipeline/daily.py
          fi
