# Daily Story Factory: one new story in 3 parts, sent to Telegram at
# 9:00, 13:00 and 18:00 India time.
#
# GitHub starts scheduled runs late (sometimes hours) or skips them, so there
# are several runs a day. Each run makes whatever part is due and not sent yet
# (pipeline/daily.py), waits until its send time, then sends it. Runs that
# find nothing to do finish in about a minute.
name: Daily story

on:
  schedule:
    - cron: "47 1 * * *"   # 07:17 IST  part 1 (sent at 9:00)
    - cron: "17 3 * * *"   # 08:47 IST  backup
    - cron: "47 5 * * *"   # 11:17 IST  part 2 (sent at 13:00)
    - cron: "17 7 * * *"   # 12:47 IST  backup
    - cron: "47 10 * * *"  # 16:17 IST  part 3 (sent at 18:00)
    - cron: "17 12 * * *"  # 17:47 IST  backup
    - cron: "37 14 * * *"  # 20:07 IST  last catch-up for anything missed
  workflow_dispatch:
    inputs:
      part:
        description: "Make and send this part right now (1, 2 or 3). Empty = whatever is due."
        default: ""

permissions:
  contents: write   # saves the story and "sent" markers back to the repo

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Kolkata
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
      KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
      # Budget mode: set the repo variable KLING_CLIPS_PER_PART to 1 (about Rs 3,300/month). 0 = free.
      KLING_CLIPS_PER_PART: ${{ vars.KLING_CLIPS_PER_PART || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
          pip install -q requests edge-tts
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"

      - name: Make and send what is due
        run: |
          if [ -n "${{ github.event.inputs.part }}" ]; then
            python pipeline/daily.py --part "${{ github.event.inputs.part }}"
          else
            python pipeline/daily.py
          fi
