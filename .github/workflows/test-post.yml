# Manual test of Facebook / Instagram uploading. Nothing is published:
# Facebook keeps the video unpublished, Instagram only uploads and processes it.
name: Test posting
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      POST_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests
          mkdir -p output/test
          # same size and format as a real 3-minute video (~100 MB) and its 83 s teaser
          ffmpeg -v error -f lavfi -i testsrc2=s=1080x1920:r=24 -f lavfi -i sine=f=300 -t 180 \
            -c:v libx264 -b:v 4M -pix_fmt yuv420p -c:a aac -ar 44100 -movflags +faststart output/test/final.mp4
          ffmpeg -v error -i output/test/final.mp4 -t 83 -c copy output/test/teaser.mp4
          ls -la output/test
          echo '{"yt_title":"Upload test","description":"test","hashtags":["#test"]}' > output/test/ep.json
          python pipeline/post_social.py output/test/final.mp4 output/test/ep.json
